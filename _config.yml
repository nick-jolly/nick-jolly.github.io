title: Your Name
tagline: Data scientist. I also take photographs.
description: Data science projects and photography by Your Name.
email: you@example.com
# For GitHub Pages project sites set baseurl to "/repo-name"; leave "" for user sites (username.github.io)
baseurl: ""
url: ""

social:
  github: yourusername
  linkedin: yourusername

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }

markdown: kramdown
exclude: [Gemfile, Gemfile.lock, README.md, vendor]
